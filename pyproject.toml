[project]
name = "cookbook"
version = "0.1.0"
description = "Utilities for fetching Instagram profile posts"
requires-python = ">=3.11"
dependencies = [
  "instaloader>=4.14.2",
  "python-dotenv>=1.0.1",
  "playwright>=1.40.0",
]

[project.scripts]
cookbook = "cookbook.main:main"
cookbook-server = "cookbook.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cookbook"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
