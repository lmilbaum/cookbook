[project]
name = "cookbook"
version = "0.1.0"
description = "Utilities for fetching Instagram profile posts"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.19.2",
  "instaloader==4.15.3",
  "playwright==1.62.0",
  "psycopg[binary]==3.3.5",
  "python-dotenv==1.2.2",
  "sqlalchemy==2.0.52",
]

[project.scripts]
cookbook = "cookbook.main:main"
cookbook-server = "cookbook.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cookbook"]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
